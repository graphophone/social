syntax = "proto3";
package likes;

service Likes {
    rpc like_post(LikeRequest) returns (Empty);
    rpc dislike_post(DislikeRequest) returns (Empty);
    rpc get_liked_posts(GetLikedpostsRequest) returns (LikedpostsResponse);
    rpc get_likes_count(GetLikesCountRequest) returns (LikesCountResponse);
}

message Empty {}

message LikeRequest {
    int64 user_id = 1;
    int64 post_id = 2;
}

message DislikeRequest {
    int64 user_id = 1;
    int64 post_id = 2;
}

message GetLikedpostsRequest {
    int64 user_id = 1;
    int32 page_number = 2;
    int32 page_size = 3;
}

message GetLikesCountRequest {
    int64 post_id = 1;
}

message LikedpostsResponse {
    repeated int64 post_ids = 1;
    int64 total_count = 2;
}

message LikesCountResponse {
    int64 count = 1;
}